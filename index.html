<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar na Planilha</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; max-width: 500px; width: 100%; }
    h1 { text-align: center; margin-bottom: 24px; color: #2c3e50; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; color: #34495e; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 15px; transition: border 0.3s; }
    input:focus, select:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.2); }
    button { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
    button:hover { background: #219a52; }
    .mensagem { text-align: center; margin-top: 16px; font-weight: 500; }
    .sucesso { color: #27ae60; }
    .erro { color: #e74c3c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Novo Lançamento</h1>
    <form id="formPlanilha">
      <!-- Tipo (Débito ou Crédito) -->
      <div class="form-group">
        <label for="tipo">Tipo de lançamento</label>
        <select id="tipo" required>
          <option value="" disabled selected>Selecione...</option>
          <option value="debito">Débito (-)</option>
          <option value="credito">Crédito (+)</option>
        </select>
      </div>

      <!-- Data -->
      <div class="form-group">
        <label for="data">Data</label>
        <input type="date" id="data" required>
      </div>

      <!-- Valor -->
      <div class="form-group">
        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor" step="0.01" min="0.01" placeholder="0,00" required>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" required>
          <option value="" disabled selected>Selecione...</option>
          <option value="Pendente">Pendente</option>
          <option value="Pago">Pago</option>
          <option value="Recebido">Recebido</option>
          <option value="Cancelado">Cancelado</option>
        </select>
      </div>

      <!-- Forma de pagamento -->
      <div class="form-group">
        <label for="formaPagamento">Forma de pagamento</label>
        <input type="text" id="formaPagamento" placeholder="Ex: Pix, Cartão, Dinheiro...">
      </div>

      <!-- Descrição -->
      <div class="form-group">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" placeholder="Ex: Supermercado, Salário..." required>
      </div>

      <!-- Sub descrição -->
      <div class="form-group">
        <label for="subDescricao">Sub descrição</label>
        <input type="text" id="subDescricao" placeholder="Detalhamento extra...">
      </div>

      <!-- Banco -->
      <div class="form-group">
        <label for="banco">Banco</label>
        <input type="text" id="banco" placeholder="Ex: Nubank, Itaú...">
      </div>

      <!-- Categorias -->
      <div class="form-group">
        <label for="categorias">Categorias</label>
        <input type="text" id="categorias" placeholder="Ex: Alimentação, Transporte...">
      </div>

      <!-- Pessoas -->
      <div class="form-group">
        <label for="pessoas">Pessoas</label>
        <input type="text" id="pessoas" placeholder="Ex: João, Maria...">
      </div>

      <button type="submit">Enviar para a Planilha</button>
    </form>
    <div id="mensagem" class="mensagem"></div>
  </div>

  <script>
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwlwcQs9vZnhqEwgDW7p1VRrGDwMH2r_8f2zX347M71n43tyDXIxzL19f50zP-UazCB7Q/exec";

    document.getElementById("formPlanilha").addEventListener("submit", async (e) => {
      e.preventDefault();
      const mensagemDiv = document.getElementById("mensagem");
      mensagemDiv.textContent = "Enviando...";
      mensagemDiv.className = "mensagem";

      // Coleta todos os campos
      const tipo = document.getElementById("tipo").value;
      const data = document.getElementById("data").value;
      const valor = parseFloat(document.getElementById("valor").value);
      const status = document.getElementById("status").value;
      const formaPagamento = document.getElementById("formaPagamento").value.trim();
      const descricao = document.getElementById("descricao").value.trim();
      const subDescricao = document.getElementById("subDescricao").value.trim();
      const banco = document.getElementById("banco").value.trim();
      const categorias = document.getElementById("categorias").value.trim();
      const pessoas = document.getElementById("pessoas").value.trim();

      // Validação básica
      if (!tipo || !data || isNaN(valor) || valor <= 0 || !descricao || !status) {
        mensagemDiv.textContent = "Preencha todos os campos obrigatórios (Tipo, Data, Valor, Status, Descrição).";
        mensagemDiv.className = "mensagem erro";
        return;
      }

      const payload = {
        tipo,
        data,
        valor,
        status,
        formaPagamento,
        descricao,
        subDescricao,
        banco,
        categorias,
        pessoas
      };

      try {
        await fetch(URL_WEB_APP, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        mensagemDiv.textContent = "✅ Registro adicionado com sucesso!";
        mensagemDiv.className = "mensagem sucesso";
        document.getElementById("formPlanilha").reset();
      } catch (erro) {
        mensagemDiv.textContent = "Erro na comunicação. Tente novamente.";
        mensagemDiv.className = "mensagem erro";
        console.error(erro);
      }
    });
  </script>
</body>
</html>
