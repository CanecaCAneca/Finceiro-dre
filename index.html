<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📊 Gestão Financeira Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --bg: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-solid: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(226, 232, 240, 0.8);
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #8b5cf6;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.03), 0 2px 4px rgba(0, 0, 0, 0.02);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.06), 0 4px 8px rgba(0, 0, 0, 0.03);
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 72px;
        }
        body.dark {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --card-solid: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(51, 65, 85, 0.8);
            --accent: #818cf8;
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 50% 0%, var(--accent-light) 0%, transparent 70%);
            background-size: 100% 400px;
            background-repeat: no-repeat;
            display: flex; min-height: 100vh; color: var(--text); transition: background 0.2s, color 0.2s;
        }
        .sidebar {
            width: var(--sidebar-width); background: rgba(255,255,255,0.65); backdrop-filter: blur(20px);
            padding: 24px 14px; display: flex; flex-direction: column; gap: 3px;
            border-radius: 0 24px 24px 0; box-shadow: var(--shadow-lg); position: fixed; top:0; left:0; bottom:0; z-index:100;
            overflow-y: auto; overflow-x: hidden; border: 1px solid var(--border); transition: width 0.3s ease, padding 0.3s ease;
        }
        .sidebar.collapsed { width: var(--sidebar-collapsed-width); padding: 24px 8px; }
        body.dark .sidebar { background: rgba(15,23,42,0.75); }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 18px; white-space: nowrap; }
        .sidebar-header h2 { font-size:1.1rem; font-weight:700; color:var(--text); transition: opacity 0.2s, width 0.2s; overflow: hidden; }
        .sidebar.collapsed .sidebar-header h2 { opacity: 0; width: 0; margin: 0; }
        .sidebar-toggle, .sidebar-minimize { background:var(--bg); border:1px solid var(--border); font-size:1rem; cursor:pointer; color:var(--text-secondary); padding:6px 10px; border-radius:10px; display: flex; align-items: center; justify-content: center; }
        .sidebar-minimize { font-size: 1.2rem; }
        .sidebar nav { display:flex; flex-direction:column; gap:2px; flex:1; }
        .sidebar nav button {
            background: none; border: none; padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 0.8rem;
            text-align: left; cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; gap: 10px;
            transition: all 0.2s; white-space: nowrap; overflow: hidden;
        }
        .sidebar nav button .nav-text { transition: opacity 0.2s, width 0.2s; opacity: 1; width: auto; }
        .sidebar.collapsed nav button .nav-text { opacity: 0; width: 0; display: inline-block; overflow: hidden; }
        .sidebar nav button.active { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        .sidebar nav button:hover:not(.active) { background: rgba(99,102,241,0.08); color: var(--accent); }
        .nav-section-label { font-size:0.6rem; text-transform:uppercase; letter-spacing:2px; color:var(--text-secondary); padding:12px 14px 4px; margin-top:4px; opacity:0.7; font-weight:700; transition: opacity 0.2s, height 0.2s, padding 0.2s; white-space: nowrap; overflow: hidden; }
        .sidebar.collapsed .nav-section-label { opacity: 0; height: 0; padding: 0; margin: 0; }
        .badge { background:var(--danger); color:#fff; font-size:0.6rem; padding:2px 8px; border-radius:20px; margin-left:auto; font-weight:700; transition: opacity 0.2s; }
        .sidebar.collapsed .badge { opacity: 0; width: 0; padding: 0; margin: 0; overflow: hidden; }
        .sidebar-footer { margin-top: auto; transition: opacity 0.2s; }
        .sidebar.collapsed .sidebar-footer { opacity: 0; pointer-events: none; }
        .main-content { margin-left:var(--sidebar-width); flex:1; padding:24px 28px; transition: margin-left 0.3s ease; }
        .sidebar.collapsed ~ .main-content { margin-left: var(--sidebar-collapsed-width); }
        .menu-toggle { display:none; position:fixed; top:16px; left:16px; z-index:200; background:var(--card-solid); border:1px solid var(--border); padding:10px 14px; border-radius:14px; box-shadow:var(--shadow-lg); cursor:pointer; font-size:1.2rem; color:var(--text); }
        .dashboard { max-width:1400px; margin:0 auto; display:flex; flex-direction:column; gap:24px; }
        .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; background:var(--card-bg); backdrop-filter:blur(12px); padding:16px 24px; border-radius:24px; box-shadow:var(--shadow); border:1px solid var(--border); }
        .header-left { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .clock { background:var(--card-solid); padding:8px 16px; border-radius:16px; box-shadow:var(--shadow-sm); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; min-width:85px; }
        .clock-time { font-size:1.2rem; font-weight:700; color:var(--accent); letter-spacing:1px; }
        .clock-date { font-size:0.65rem; color:var(--text-secondary); font-weight:500; }
        h1 { font-size:1.4rem; font-weight:700; background:linear-gradient(135deg, var(--text) 0%, var(--accent) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .btn { padding:8px 18px; border-radius:30px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:0.78rem; border:1px solid var(--border); box-shadow:var(--shadow-sm); background:var(--card-solid); color:var(--text); transition:all 0.2s; text-decoration:none; }
        .btn:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--accent); color:var(--accent); }
        .page { display:none; flex-direction:column; gap:20px; animation: fadeIn 0.3s ease; }
        .page.active { display:flex; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .cards-row { display:flex; flex-wrap:wrap; gap:16px; }
        .card { background:var(--card-bg); backdrop-filter:blur(10px); border-radius:20px; padding:20px 24px; flex:1 1 170px; box-shadow:var(--shadow); border:1px solid var(--border); transition:all 0.2s; position:relative; overflow:hidden; }
        .card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--accent-light); }
        .card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; border-radius:0 4px 4px 0; }
        .card-entrada::before { background:var(--success); } .card-saida::before { background:var(--danger); } .card-saldo::before { background:var(--accent); }
        .card-title { font-size:0.68rem; text-transform:uppercase; letter-spacing:1.5px; font-weight:700; color:var(--text-secondary); margin-bottom:10px; }
        .card-value { font-size:1.6rem; font-weight:800; } .entrada { color:var(--success); } .saida { color:var(--danger); } .saldo { color:var(--accent); }
        .filter-bar { background:var(--card-bg); backdrop-filter:blur(10px); border-radius:20px; padding:14px 18px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; border:1px solid var(--border); box-shadow:var(--shadow-sm); }
        .filter-group { display:flex; flex-direction:column; gap:4px; min-width:85px; }
        .filter-group label { font-size:0.6rem; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px; }
        .filter-group select, .filter-group input { padding:8px 12px; border:1.5px solid var(--border); border-radius:14px; font-size:0.78rem; background:var(--card-solid); color:var(--text); transition:all 0.2s; font-family:inherit; }
        .table-container { background:var(--card-bg); backdrop-filter:blur(10px); border-radius:20px; overflow-x:auto; max-height:450px; border:1px solid var(--border); box-shadow:var(--shadow); }
        table { width:100%; border-collapse:collapse; font-size:0.75rem; min-width:550px; }
        th { background:rgba(248,250,253,0.9); padding:12px 10px; text-align:left; font-weight:700; color:var(--text-secondary); position:sticky; top:0; z-index:1; text-transform:uppercase; letter-spacing:0.5px; font-size:0.65rem; border-bottom:2px solid var(--border); }
        body.dark th { background:rgba(30,41,59,0.95); }
        td { padding:10px; border-bottom:1px solid var(--border); color:var(--text); }
        .charts-row { display:flex; flex-wrap:wrap; gap:18px; }
        .chart-box { flex:1 1 380px; background:var(--card-bg); backdrop-filter:blur(10px); border-radius:20px; padding:18px 20px; box-shadow:var(--shadow); border:1px solid var(--border); }
        canvas { max-height:260px; width:100% !important; }
        @media (max-width:768px) {
            .sidebar { transform:translateX(-100%); }
            .sidebar.open { transform:translateX(0); }
            .main-content { margin-left:0 !important; padding:12px; }
            .menu-toggle { display:block; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menuToggle">☰</button>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><h2>📊 Gestão</h2><button class="sidebar-minimize" id="sidebarMinimize">◀</button></div>
        <nav>
            <button class="tab-btn active" data-page="resumo">📋 <span class="nav-text">Resumo Geral</span></button>
            <button class="tab-btn" data-page="debitos">🔴 <span class="nav-text">Débitos</span></button>
            <button class="tab-btn" data-page="creditos">🟢 <span class="nav-text">Créditos</span></button>
            <button class="tab-btn" data-page="dre">🧾 <span class="nav-text">D.R.E.</span></button>
            <button class="tab-btn" data-page="calendario">📅 <span class="nav-text">Calendário</span></button>
        </nav>
    </aside>
    <div class="main-content" id="mainContent">
        <div class="dashboard">
            <div class="header"><h1>📊 Gestão Financeira Premium</h1><button class="btn" id="darkModeToggle">🌙</button></div>

            <!-- D.R.E. -->
            <div id="dre" class="page">
                <div class="cards-row">
                    <div class="card card-entrada"><div class="card-title">💰 Receita Bruta</div><div class="card-value entrada" id="dreReceita">R$ 0,00</div></div>
                    <div class="card card-saida"><div class="card-title">📤 Despesas</div><div class="card-value saida" id="dreDespesa">R$ 0,00</div></div>
                    <div class="card card-saldo"><div class="card-title">⚖️ Resultado</div><div class="card-value saldo" id="dreResultado">R$ 0,00</div></div>
                    <div class="card"><div class="card-title">📊 Margem</div><div class="card-value" id="dreMargem">0,0%</div></div>
                </div>
                <div class="filter-bar" id="filtroDre">
                    <div class="filter-group"><label>Ano</label><select id="dreAno"><option value="">Todos</option></select></div>
                    <div class="filter-group"><label>Mês</label><select id="dreMes"><option value="">Todos</option></select></div>
                    <button class="btn" id="limparFiltrosDre">Limpar</button>
                </div>
                <div class="table-container">
                    <table id="tabelaDRE">
                        <thead><tr><th>Conta</th><th>Valor (R$)</th><th>%</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="charts-row">
                    <div class="chart-box"><h3>🥧 Receitas</h3><canvas id="drePizzaReceitas"></canvas></div>
                    <div class="chart-box"><h3>🥧 Despesas</h3><canvas id="drePizzaDespesas"></canvas></div>
                </div>
            </div>
            <!-- Outras páginas (resumo, débitos, créditos, calendário) omitidas por brevidade -->
        </div>
    </div>
    <script>
        (function() {
            const $ = id => document.getElementById(id);
            const PUB_DOC = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSWlUNgP29Erp8Rh5AZPg430wul7T9IwPBPgozPQpO2ig9g8gpJoTn4JNfcKAbBSNH59VngkPE4A7dF/pub';
            const GID_DEB = '1145670122', GID_CRE = '902301839';
            let debitos = [], creditos = [], charts = {};
            const fm = v => Number(v).toLocaleString('pt-BR', { minimumFractionDigits:2 });
            const fmp = v => Number(v).toLocaleString('pt-BR', { minimumFractionDigits:1 }) + '%';
            const sumBy = (arr, fn) => { let t=0; for(const i of arr) if(fn(i)) t+=i.valor; return Math.round(t*100)/100; };

            async function fetchData(gid, tipo) {
                const resp = await fetch(`${PUB_DOC}?gid=${gid}&single=true&output=csv`);
                const txt = await resp.text();
                const rows = txt.split('\n').filter(l => l.trim()).map(l => {
                    const cols = []; let cur = '', q = false;
                    for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { cols.push(cur.trim()); cur = ''; } else cur += ch; }
                    cols.push(cur.trim()); return cols;
                });
                const header = rows[0].map(h => h.toLowerCase().normalize('NFD').replace(/[^a-z]/g,''));
                const idx = terms => { for (const t of terms) { const i = header.findIndex(h => h.includes(t)); if (i!==-1) return i; } return -1; };
                const colData = idx(['data','date','dt']);
                const colValor = idx(['valor','value','vlr']);
                const colDesc = idx(['descricao','desc','nome']);
                const colCat = idx(['categoria','cat','tipo']);
                return rows.slice(1).map(r => {
                    const get = i => (i!==-1 && i<r.length) ? r[i] : '';
                    const dataStr = get(colData);
                    const parts = dataStr.split('/');
                    const dia = +parts[0] || 1, mes = +parts[1] || 1, ano = +parts[2] || 2025;
                    let valor = parseFloat((get(colValor)||'0').replace(/[R$\s]/g,'').replace(',','.')) || 0;
                    return { data: dataStr, valor, descricao: get(colDesc), categoria: get(colCat) || 'Outros', dia, mes, ano, tipo };
                }).filter(x => x.data);
            }

            function updateDRE() {
                const ano = $('dreAno')?.value || '';
                const mes = $('dreMes')?.value || '';
                const rec = creditos.filter(t => (!ano || t.ano === +ano) && (!mes || t.mes === +mes));
                const desp = debitos.filter(t => (!ano || t.ano === +ano) && (!mes || t.mes === +mes));
                const tr = sumBy(rec, ()=>true), td = sumBy(desp, ()=>true), res = tr - td;
                const mg = tr > 0 ? (res/tr)*100 : 0;
                $('dreReceita').textContent = `R$ ${fm(tr)}`;
                $('dreDespesa').textContent = `R$ ${fm(td)}`;
                $('dreResultado').textContent = `R$ ${fm(res)}`;
                $('dreMargem').textContent = tr === 0 ? 'N/A' : fmp(mg);

                const cr = {}, cd = {};
                for (const c of rec) cr[c.categoria] = (cr[c.categoria]||0) + c.valor;
                for (const d of desp) cd[d.categoria] = (cd[d.categoria]||0) + d.valor;

                if (charts['drePizzaReceitas']) charts['drePizzaReceitas'].destroy();
                if (charts['drePizzaDespesas']) charts['drePizzaDespesas'].destroy();
                const ctx1 = $('drePizzaReceitas')?.getContext('2d');
                if (ctx1) charts['drePizzaReceitas'] = new Chart(ctx1, { type:'doughnut', data:{ labels:Object.keys(cr), datasets:[{ data:Object.values(cr), backgroundColor:['#10b981','#34d399','#6ee7b7'] }] } });
                const ctx2 = $('drePizzaDespesas')?.getContext('2d');
                if (ctx2) charts['drePizzaDespesas'] = new Chart(ctx2, { type:'doughnut', data:{ labels:Object.keys(cd), datasets:[{ data:Object.values(cd), backgroundColor:['#ef4444','#f87171','#fca5a5'] }] } });

                const tbody = document.querySelector('#tabelaDRE tbody');
                tbody.innerHTML = '';
                const add = (c, v, p) => { const tr = document.createElement('tr'); tr.innerHTML = `<td>${c}</td><td>R$ ${fm(v)}</td><td>${p}</td>`; tbody.appendChild(tr); };
                add('<strong>RECEITAS</strong>', '', '');
                for (const [c,v] of Object.entries(cr).sort((a,b)=>b[1]-a[1])) add(c, v, tr>0?fmp((v/tr)*100):'0,0%');
                add('<strong>Total Receitas</strong>', tr, '100,0%');
                add('<strong>DESPESAS</strong>', '', '');
                for (const [c,v] of Object.entries(cd).sort((a,b)=>b[1]-a[1])) add(c, v, td>0?fmp((v/td)*100):'0,0%');
                add('<strong>Total Despesas</strong>', td, '100,0%');
                add(`<strong>RESULTADO</strong>`, res, tr===0?'N/A':fmp(mg));
            }

            async function loadData() {
                debitos = await fetchData(GID_DEB, 'debito');
                creditos = await fetchData(GID_CRE, 'credito');
                const all = [...debitos, ...creditos];
                const anos = [...new Set(all.map(t=>t.ano))].sort((a,b)=>b-a);
                const preencher = (id, valores) => { const s = $(id); if(s) { s.innerHTML = '<option value="">Todos</option>' + valores.map(v => `<option value="${v}">${v}</option>`).join(''); } };
                preencher('dreAno', anos);
                preencher('dreMes', Array.from({length:12},(_,i)=>i+1));
                $('dreAno').onchange = updateDRE;
                $('dreMes').onchange = updateDRE;
                $('limparFiltrosDre').onclick = () => { $('dreAno').value = ''; $('dreMes').value = ''; updateDRE(); };
                updateDRE();
            }

            document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                $(btn.dataset.page).classList.add('active');
            });
            $('darkModeToggle').onclick = () => document.body.classList.toggle('dark');
            loadData();
        })();
    </script>
</body>
</html>
