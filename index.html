<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📊 Gestão Financeira Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --bg: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-solid: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(226, 232, 240, 0.8);
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #8b5cf6;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.03), 0 2px 4px rgba(0, 0, 0, 0.02);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.06), 0 4px 8px rgba(0, 0, 0, 0.03);
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 72px;
        }
        body.dark {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --card-solid: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(51, 65, 85, 0.8);
            --accent: #818cf8;
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 50% 0%, var(--accent-light) 0%, transparent 70%);
            background-size: 100% 400px;
            background-repeat: no-repeat;
            display: flex;
            min-height: 100vh;
            color: var(--text);
            transition: background 0.2s, color 0.2s;
        }
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(20px);
            padding: 24px 14px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            border-radius: 0 24px 24px 0;
            box-shadow: var(--shadow-lg);
            position: fixed;
            top:0; left:0; bottom:0;
            z-index: 100;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid var(--border);
            transition: width 0.3s ease, padding 0.3s ease;
        }
        .sidebar.collapsed { width: var(--sidebar-collapsed-width); padding: 24px 8px; }
        body.dark .sidebar { background: rgba(15,23,42,0.75); }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 18px; white-space: nowrap; }
        .sidebar-header h2 { font-size:1.1rem; font-weight:700; color:var(--text); transition: opacity 0.2s, width 0.2s; overflow: hidden; }
        .sidebar.collapsed .sidebar-header h2 { opacity: 0; width: 0; margin: 0; }
        .sidebar-toggle, .sidebar-minimize { background:var(--bg); border:1px solid var(--border); font-size:1rem; cursor:pointer; color:var(--text-secondary); padding:6px 10px; border-radius:10px; display: flex; align-items: center; justify-content: center; }
        .sidebar-minimize { font-size: 1.2rem; }
        .sidebar nav { display:flex; flex-direction:column; gap:2px; flex:1; }
        .sidebar nav button {
            background: none; border: none; padding: 10px 14px; border-radius: 12px; font-weight: 600;
            font-size: 0.8rem; text-align: left; cursor: pointer; color: var(--text-secondary);
            display: flex; align-items: center; gap: 10px; transition: all 0.2s; white-space: nowrap; overflow: hidden;
        }
        .sidebar nav button .nav-text { transition: opacity 0.2s, width 0.2s; opacity: 1; width: auto; }
        .sidebar.collapsed nav button .nav-text { opacity: 0; width: 0; display: inline-block; overflow: hidden; }
        .sidebar nav button.active { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        .sidebar nav button:hover:not(.active) { background: rgba(99,102,241,0.08); color: var(--accent); }
        .nav-section-label { font-size:0.6rem; text-transform:uppercase; letter-spacing:2px; color:var(--text-secondary); padding:12px 14px 4px; margin-top:4px; opacity:0.7; font-weight:700; transition: opacity 0.2s, height 0.2s, padding 0.2s; white-space: nowrap; overflow: hidden; }
        .sidebar.collapsed .nav-section-label { opacity: 0; height: 0; padding: 0; margin: 0; }
        .badge { background:var(--danger); color:#fff; font-size:0.6rem; padding:2px 8px; border-radius:20px; margin-left:auto; font-weight:700; transition: opacity 0.2s; }
        .sidebar.collapsed .badge { opacity: 0; width: 0; padding: 0; margin: 0; overflow: hidden; }
        .sidebar-footer { margin-top: auto; transition: opacity 0.2s; }
        .sidebar.collapsed .sidebar-footer { opacity: 0; pointer-events: none; }
        .main-content { margin-left:var(--sidebar-width); flex:1; padding:24px 28px; transition: margin-left 0.3s ease; }
        .sidebar.collapsed ~ .main-content { margin-left: var(--sidebar-collapsed-width); }
        .menu-toggle { display:none; position:fixed; top:16px; left:16px; z-index:200; background:var(--card-solid); border:1px solid var(--border); padding:10px 14px; border-radius:14px; box-shadow:var(--shadow-lg); cursor:pointer; font-size:1.2rem; color:var(--text); }
        .dashboard { max-width:1400px; margin:0 auto; display:flex; flex-direction:column; gap:24px; }
        .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; background:var(--card-bg); backdrop-filter:blur(12px); padding:16px 24px; border-radius:24px; box-shadow:var(--shadow); border:1px solid var(--border); }
        .header-left { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .clock { background:var(--card-solid); padding:8px 16px; border-radius:16px; box-shadow:var(--shadow-sm); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; min-width:85px; }
        .clock-time { font-size:1.2rem; font-weight:700; color:var(--accent); letter-spacing:1px; }
        .clock-date { font-size:0.65rem; color:var(--text-secondary); font-weight:500; }
        h1 { font-size:1.4rem; font-weight:700; background:linear-gradient(135deg, var(--text) 0%, var(--accent) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .btn { padding:8px 18px; border-radius:30px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:0.78rem; border:1px solid var(--border); box-shadow:var(--shadow-sm); background:var(--card-solid); color:var(--text); transition:all 0.2s; text-decoration:none; }
        .btn:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--accent); color:var(--accent); }
        .page { display:none; flex-direction:column; gap:20px; animation: fadeIn 0.3s ease; }
        .page.active { display:flex; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .cards-row { display:flex; flex-wrap:wrap; gap:16px; }
        .card { background:var(--card-bg); backdrop-filter:blur(10px); border-radius:20px; padding:20px 24px; flex:1 1 170px; box-shadow:var(--shadow); border:1px solid var(--border); transition:all 0.2s; position:relative; overflow:hidden; }
        .card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--accent-light); }
        .card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; border-radius:0 4px 4px 0; }
        .card-entrada::before { background:var(--success); } .card-saida::before { background:var(--danger); } .card-saldo::before { background:var(--accent); }
        .card-title { font-size:0.68rem; text-transform:uppercase; letter-spacing:1.5px; font-weight:700; color:var(--text-secondary); margin-bottom:10px; }
        .card-value { font-size:1.6rem; font-weight:800; } .entrada { color:var(--success); } .saida { color:var(--danger); } .saldo { color:var(--accent); }
        .filter-bar { background:var(--card-bg); backdrop-filter:blur(10px); border-radius:20px; padding:14px 18px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; border:1px solid var(--border); box-shadow:var(--shadow-sm); }
        .filter-group { display:flex; flex-direction:column; gap:4px; min-width:85px; }
        .filter-group label { font-size:0.6rem; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px; }
        .filter-group select, .filter-group input { padding:8px 12px; border:1.5px solid var(--border); border-radius:14px; font-size:0.78rem; background:var(--card-solid); color:var(--text); transition:all 0.2s; font-family:inherit; }
        .table-container { background:var(--card-bg); backdrop-filter:blur(10px); border-radius:20px; overflow-x:auto; max-height:450px; border:1px solid var(--border); box-shadow:var(--shadow); }
        table { width:100%; border-collapse:collapse; font-size:0.75rem; min-width:550px; }
        th { background:rgba(248,250,253,0.9); padding:12px 10px; text-align:left; font-weight:700; color:var(--text-secondary); position:sticky; top:0; z-index:1; text-transform:uppercase; letter-spacing:0.5px; font-size:0.65rem; border-bottom:2px solid var(--border); }
        body.dark th { background:rgba(30,41,59,0.95); }
        td { padding:10px; border-bottom:1px solid var(--border); color:var(--text); }
        tr:hover td { background:rgba(99,102,241,0.03); }
        .debito-row td:first-child { border-left:3px solid var(--danger); }
        .credito-row td:first-child { border-left:3px solid var(--success); }
        .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; background:var(--card-bg); border-radius:20px; padding:12px; border:1px solid var(--border); }
        .calendar-header-cell { text-align:center; font-weight:700; padding:8px; font-size:0.68rem; color:var(--text-secondary); }
        .calendar-cell { background:var(--card-solid); border:1px solid var(--border); border-radius:10px; padding:6px; min-height:60px; font-size:0.7rem; cursor:pointer; transition:all 0.2s; }
        .calendar-cell.today { border:2px solid var(--accent); }
        .calendar-cell.selected { background:rgba(99,102,241,0.2); border:2px solid var(--accent); }
        .info-selected {
            background:var(--card-bg); border-radius:16px; padding:12px 18px; display:flex;
            align-items:center; gap:12px; border:1px solid var(--accent-light);
        }
        .mini-entrada { font-size:0.58rem; color:var(--success); font-weight:600; }
        .mini-saida { font-size:0.58rem; color:var(--danger); font-weight:600; }
        @media (max-width:768px) {
            .sidebar { transform:translateX(-100%); }
            .sidebar.open { transform:translateX(0); }
            .main-content { margin-left:0 !important; padding:12px; }
            .menu-toggle { display:block; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menuToggle">☰</button>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📊 Gestão</h2>
            <button class="sidebar-minimize" id="sidebarMinimize">◀</button>
        </div>
        <nav>
            <button class="tab-btn active" data-page="resumo">📋 <span class="nav-text">Resumo Geral</span></button>
            <button class="tab-btn" data-page="calendario">📅 <span class="nav-text">Calendário</span></button>
        </nav>
    </aside>
    <div class="main-content" id="mainContent">
        <div class="dashboard">
            <div class="header">
                <h1>📊 Gestão Financeira Premium</h1>
                <button class="btn" id="darkModeToggle">🌙</button>
            </div>
            <div id="resumo" class="page active"><p>Resumo Geral (em construção)</p></div>
            <div id="calendario" class="page">
                <div class="cards-row">
                    <div class="card card-entrada"><div class="card-title">💰 Entradas do Mês</div><div class="card-value entrada" id="calEntradasMes">R$ 0,00</div></div>
                    <div class="card card-saida"><div class="card-title">📤 Saídas do Mês</div><div class="card-value saida" id="calSaidasMes">R$ 0,00</div></div>
                    <div class="card card-saldo"><div class="card-title">⚖️ Saldo do Mês</div><div class="card-value saldo" id="calSaldoMes">R$ 0,00</div></div>
                </div>
                <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--card-bg); border-radius:20px; padding:14px 18px; border:1px solid var(--border);">
                    <div class="filter-group"><label>Mês</label><select id="calMes"></select></div>
                    <div class="filter-group"><label>Ano</label><select id="calAno"></select></div>
                    <button class="btn" id="calHojeBtn" style="background:var(--accent);color:#fff;">📍 Hoje</button>
                    <button class="btn" id="calAnteriorBtn">◀</button>
                    <button class="btn" id="calProximoBtn">▶</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div class="info-selected" id="calInfoSelected" style="display:none;">
                    <span id="calInfoLabel"></span>
                    <button id="calClearSelection">✕ Limpar</button>
                </div>
                <div class="table-container" id="calTabelaContainer" style="display:none;">
                    <table id="tabelaCalendarioTransacoes">
                        <thead><tr>
                            <th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th>
                            <th>Status</th><th>Forma Pag.</th><th>Banco</th><th>Pessoa</th><th>Tipo</th>
                        </tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const $ = id => document.getElementById(id);
            const PUB_DOC = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSWlUNgP29Erp8Rh5AZPg430wul7T9IwPBPgozPQpO2ig9g8gpJoTn4JNfcKAbBSNH59VngkPE4A7dF/pub';
            const GID_DEB = '1145670122', GID_CRE = '902301839';
            let debitos = [], creditos = [];
            let selectedDay = { ano: null, mes: null, dia: null };
            const mesesNom = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
            const fm = v => Number(v).toLocaleString('pt-BR', { minimumFractionDigits:2 });

            async function fetchData(gid, tipo) {
                const resp = await fetch(`${PUB_DOC}?gid=${gid}&single=true&output=csv`);
                const txt = await resp.text();
                const rows = txt.split('\n').filter(l => l.trim()).map(l => {
                    const cols = []; let cur = '', q = false;
                    for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { cols.push(cur.trim()); cur = ''; } else cur += ch; }
                    cols.push(cur.trim()); return cols;
                });
                const header = rows[0].map(h => h.toLowerCase().normalize('NFD').replace(/[^a-z]/g,''));
                const idx = terms => { for (const t of terms) { const i = header.findIndex(h => h.includes(t)); if (i!==-1) return i; } return -1; };
                const colData = idx(['data','date','dt']);
                const colValor = idx(['valor','value','vlr']);
                const colStatus = idx(['status','situacao','pago']);
                const colForma = idx(['forma','formapagamento','pagamento']);
                const colDesc = idx(['descricao','desc','nome','item']);
                const colBanco = idx(['banco','bank','instituicao']);
                const colCat = idx(['categoria','cat','tipo']);
                const colPessoa = idx(['pessoa','nome','responsavel']);
                return rows.slice(1).map(r => {
                    const get = i => (i!==-1 && i<r.length) ? r[i] : '';
                    const dataStr = get(colData);
                    const parts = dataStr.split('/');
                    const dia = +parts[0] || 1, mes = +parts[1] || 1, ano = +parts[2] || 2025;
                    let valor = parseFloat((get(colValor)||'0').replace(/[R$\s]/g,'').replace(',','.')) || 0;
                    return {
                        data: dataStr, valor,
                        status: get(colStatus) || 'Pendente',
                        formaPagamento: get(colForma) || 'Não informado',
                        descricao: get(colDesc) || '',
                        banco: get(colBanco) || 'Não informado',
                        categoria: get(colCat) || 'Outros',
                        pessoa: get(colPessoa) || 'Geral',
                        dia, mes, ano, tipo
                    };
                }).filter(x => x.data);
            }

            async function loadData() {
                debitos = await fetchData(GID_DEB, 'debito');
                creditos = await fetchData(GID_CRE, 'credito');
                updateCalendario();
            }

            function updateCalendario() {
                const mes = +($('calMes')?.value || new Date().getMonth()+1);
                const ano = +($('calAno')?.value || new Date().getFullYear());
                const grid = $('calendarGrid'); if (!grid) return;
                const diasNoMes = new Date(ano, mes, 0).getDate();
                const inicioSemana = new Date(ano, mes-1, 1).getDay();
                const hoje = new Date(); hoje.setHours(0,0,0,0);
                const trans = [...creditos, ...debitos].filter(t => t.ano === ano && t.mes === mes);
                const mapa = {};
                for (const t of trans) { const d = t.dia; if (!mapa[d]) mapa[d] = { ent:0, sai:0 }; if (t.tipo==='credito') mapa[d].ent += t.valor; else mapa[d].sai += t.valor; }
                let et = 0, st = 0; for (const d in mapa) { et += mapa[d].ent; st += mapa[d].sai; }
                $('calEntradasMes').textContent = `R$ ${fm(et)}`;
                $('calSaidasMes').textContent = `R$ ${fm(st)}`;
                $('calSaldoMes').textContent = `R$ ${fm(et-st)}`;

                let h = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d => `<div class="calendar-header-cell">${d}</div>`).join('');
                for (let i=0; i<inicioSemana; i++) h += '<div class="calendar-cell empty"></div>';
                for (let dia=1; dia<=diasNoMes; dia++) {
                    const isToday = new Date(ano, mes-1, dia).getTime() === hoje.getTime();
                    const isSelected = selectedDay.ano === ano && selectedDay.mes === mes && selectedDay.dia === dia;
                    const info = mapa[dia] || { ent:0, sai:0 };
                    h += `<div class="calendar-cell${isToday?' today':''}${isSelected?' selected':''}" data-dia="${dia}" data-mes="${mes}" data-ano="${ano}">
                        <div class="day-num">${dia}</div>
                        ${info.ent>0?`<span class="mini-entrada">+${fm(info.ent)}</span>`:''}
                        ${info.sai>0?`<span class="mini-saida">-${fm(info.sai)}</span>`:''}
                    </div>`;
                }
                grid.innerHTML = h;
                grid.querySelectorAll('.calendar-cell[data-dia]').forEach(cell => {
                    cell.addEventListener('click', () => {
                        selectedDay = { ano: +cell.dataset.ano, mes: +cell.dataset.mes, dia: +cell.dataset.dia };
                        updateCalendario();
                        mostrarTransacoesDoDia(selectedDay.ano, selectedDay.mes, selectedDay.dia);
                    });
                });
                if (selectedDay.ano && selectedDay.mes && selectedDay.dia) {
                    mostrarTransacoesDoDia(selectedDay.ano, selectedDay.mes, selectedDay.dia);
                } else {
                    $('calInfoSelected').style.display = 'none';
                    $('calTabelaContainer').style.display = 'none';
                }
            }

            function mostrarTransacoesDoDia(ano, mes, dia) {
                const trans = [...creditos, ...debitos].filter(t => t.ano === ano && t.mes === mes && t.dia === dia);
                $('calInfoSelected').style.display = 'flex';
                $('calInfoLabel').textContent = `📅 ${dia}/${mes}/${ano} — ${trans.length} transação(oes)`;
                $('calTabelaContainer').style.display = 'block';
                const tbody = document.querySelector('#tabelaCalendarioTransacoes tbody');
                tbody.innerHTML = trans.map(t => `
                    <tr class="${t.tipo==='debito'?'debito-row':'credito-row'}">
                        <td>${t.data}</td>
                        <td>${t.descricao}</td>
                        <td>${t.categoria}</td>
                        <td style="color:${t.tipo==='debito'?'var(--danger)':'var(--success)'}; font-weight:600;">R$ ${fm(t.valor)}</td>
                        <td>${t.status}</td>
                        <td>${t.formaPagamento}</td>
                        <td>${t.banco}</td>
                        <td>${t.pessoa}</td>
                        <td>${t.tipo==='credito'?'🟢 Crédito':'🔴 Débito'}</td>
                    </tr>
                `).join('') || '<tr><td colspan="9">Nenhuma transação neste dia.</td></tr>';
            }

            $('calClearSelection').onclick = () => { selectedDay = {}; updateCalendario(); };
            $('calHojeBtn').onclick = () => { const hj = new Date(); $('calMes').value = hj.getMonth()+1; $('calAno').value = hj.getFullYear(); selectedDay = {}; updateCalendario(); };
            $('calAnteriorBtn').onclick = () => { let m = +$('calMes').value, a = +$('calAno').value; m--; if(m<1){ m=12; a--; } $('calMes').value = m; $('calAno').value = a; selectedDay = {}; updateCalendario(); };
            $('calProximoBtn').onclick = () => { let m = +$('calMes').value, a = +$('calAno').value; m++; if(m>12){ m=1; a++; } $('calMes').value = m; $('calAno').value = a; selectedDay = {}; updateCalendario(); };

            const anosDisponiveis = [2023,2024,2025,2026];
            $('calAno').innerHTML = anosDisponiveis.map(a => `<option value="${a}">${a}</option>`).join('');
            $('calAno').value = new Date().getFullYear();
            $('calMes').innerHTML = mesesNom.map((n,i) => `<option value="${i+1}">${n}</option>`).join('');
            $('calMes').value = new Date().getMonth()+1;
            $('calMes').onchange = () => { selectedDay = {}; updateCalendario(); };
            $('calAno').onchange = () => { selectedDay = {}; updateCalendario(); };

            document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                $(btn.dataset.page).classList.add('active');
            });

            $('darkModeToggle').onclick = () => document.body.classList.toggle('dark');

            loadData();
        })();
    </script>
</body>
</html>
